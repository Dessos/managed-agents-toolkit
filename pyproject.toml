[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-managed-agents"
version = "0.5.1"
description = "Multi-project toolkit for Anthropic's Claude Managed Agents — tiered execution, project config, IP-defensive MCP bridge, outcome-driven workflows."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Dessos", email = "32850692+Dessos@users.noreply.github.com"}]
keywords = ["anthropic", "claude", "managed-agents", "agents", "mcp", "llm"]

# Core deps — kept tight on purpose. Heavy/optional features go under extras.
dependencies = [
  # SDK + beta headers
  "anthropic>=0.87.0",
  # CLI
  "typer>=0.12",
  "rich>=13.7",
  # Config + models
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "PyYAML>=6.0",
  "python-dotenv>=1.0",
  # HTTP (Anthropic SDK uses httpx internally; we ensure version compatibility)
  "httpx>=0.27",
]

[project.optional-dependencies]
webhook = [
  # Webhook receiver: only needed when running 'cma webhook serve' locally.
  "fastapi>=0.110",
  "uvicorn[standard]>=0.23",
]
prometheus = [
  # Optional Pushgateway emitter for telemetry → Grafana stack integration.
  "prometheus-client>=0.20",
]
executor = [
  # Local executor MCP server: only needed when running 'cma executor serve'.
  "mcp>=1.9",
]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=6.0",
  "pytest-timeout>=2.3",
  "ruff>=0.6",
  "mypy>=1.8",
  "types-PyYAML",
]

[project.scripts]
cma = "cma.cli.__main__:app"

[project.urls]
Repository = "https://github.com/Dessos/managed-agents-toolkit"
Plan = "https://github.com/Dessos/managed-agents-toolkit/blob/claude/docs/plan.md"

# ---------------------------------------------------------------------------
# Package discovery
# ---------------------------------------------------------------------------

[tool.setuptools.packages.find]
where = ["src"]
include = ["cma*"]

[tool.setuptools.package-data]
cma = ["templates/**/*"]

# ---------------------------------------------------------------------------
# Lint + type
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "RUF"]
# E501: line length — handled by formatter when applicable.
# RUF001/002/003: ambiguous unicode characters in strings/docstrings/comments.
#   Intentional in cost math comments ('2.0× base', '$5/Mt', '→') and in
#   doc snippets. Reads better than ASCII-only alternatives.
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Tests: blind 'pytest.raises(Exception)' is intentional for "any error here"
# assertions. Bare assert (B011) is the whole point of pytest.
"tests/**" = ["B011", "B017"]
# CLI: typer.Option in defaults is the canonical pattern (B008 false positive).
"src/cma/cli/**" = ["B008"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
strict_equality = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["anthropic.*", "mcp.*", "pandas", "pandas.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Test
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
filterwarnings = [
  "ignore::DeprecationWarning",
]

[tool.coverage.run]
branch = true
source = ["src/cma"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]
