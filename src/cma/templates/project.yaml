# .managed-agents/project.yaml
# Generated by `cma project init`. Edit to taste.
#
# See docs/project-config.md (in the claude-managed-agents toolkit) for the
# full schema.

project:
  name: {{PROJECT_NAME}}
  workspace_root: {{WORKSPACE_ROOT}}
  description: ""

defaults:
  model: claude-opus-4-7
  # environment: <name>        # Optional default environment; refers to one
                               # of the entries in 'environments' below.

# Each entry is either a template (resolved from toolkit templates/) or a
# local file (resolved relative to .managed-agents/).
agents: []
  # Examples:
  # - template: code-reviewer
  # - local: agents/your-critic.yaml

environments: []
  # Examples:
  # - template: python-data
  # - local: environments/research-deep.yaml

skills: []
  # Examples:
  # - type: anthropic
  #   skill_id: xlsx
  # - type: anthropic
  #   skill_id: pdf

mcp_servers: []
  # Only REMOTE MCP servers (HTTP streamable transport) are supported by
  # Managed Agents. For local MCP servers, see local_mcp_bridge.yaml.
  # Example:
  # - name: grafana
  #   url: ${GRAFANA_MCP_URL}

workflows: []
  # Examples:
  # - template: long-compute
  # - template: pr-review

budget:
  daily_usd_cap: 25.0
  per_session_token_cap: 5000000
  warn_at_pct: 75
  kill_on_breach: true

# webhook:
#   endpoint: ${CMA_WEBHOOK_ENDPOINT}
#   signing_secret_env: ANTHROPIC_WEBHOOK_SIGNING_KEY
#   subscribe_events:
#     - session.status_idled
#     - session.status_terminated
#     - session.outcome_evaluation_ended
#     - vault_credential.refresh_failed

telemetry:
  jsonl_path: null              # Falls back to platform default
  prometheus_pushgateway: null
